# ===== 路径 =====
skills.dir=./skills
# Python/Anaconda 解释器；留空自动探测，内网 Win7 可填 C:\ProgramData\Anaconda3\python.exe
python.path=
# 空间外读（paths.read.allowOutside）：true 时 Read/Grep/Glob 可读取工作区外文件；false（默认）时越界读弹确认
paths.read.allowOutside=false
# 空间外写（paths.write.allowOutside）：true 时 Write/Edit 越界写放行至高危确认链（确认跳过/白名单/弹框）；false（默认）时越界写直接拒绝
paths.write.allowOutside=false

# ===== 高危操作确认 =====
# 权限模式：read-only=拒绝修改；workspace-write=工作区内按风险确认；full=跳过高危确认（路径守卫仍生效）
permission.mode=workspace-write
confirm.skip=false
confirm.whitelist.tools=
confirm.whitelist.commands=

# ===== 输入框 =====
# 输入框发送键：true=Enter 发送（Ctrl+Enter 换行）；false=Ctrl+Enter 发送（Enter 换行）；无键（空/旧配置）默认 true
input.enterSends=true

# ===== 上下文策略 =====
# compact/balanced/verbose；大文件读取 chunked/full（默认分段，避免挤占 Qwen 上下文）
context.outputMode=balanced
context.readMode=chunked

# ===== 工具空输出占位 =====
# 工具执行成功但无输出时（如 mvn -q 输出重定向、读取空文件），发送给模型的 tool 消息用「输出内容为空」占位，
# 避免空 content 触发服务端稳定拒绝导致重试永不成功；true=开启；false=关闭（默认，无该配置同样关闭）
agent.emptyOutput.placeholder=false

# ===== 自举启动器 =====
# 自举控制台窗口：true=启动时开控制台窗口（排障看日志）；false=隐藏（默认，javaw 直启无窗口）
boot.console=false
