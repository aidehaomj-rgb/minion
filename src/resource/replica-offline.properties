# replica-offline 验收配置（v2.4 §14.3：显式开启全部已验证复刻能力的固定验收配置）
# 用法：把本文件内容并入/替换 jar 目录下的 config.properties 后启动，即为 replica-offline 形态。
# 与 legacy 默认（config.properties）的区别仅是复刻开关打开；安全修复例外（带 ★）在两种形态下都默认开。

# ===== 安全（★=安全修复例外，legacy 也开；此处显式列出供核对） =====
permission.engine.v2=true
bash.analyzer.enabled=true
mcp.confirm.skip=false
secret.store.v2=true
ssh.strictHostKey=true

# ===== 复刻行为开关（legacy 默认 false 的项在此全部打开） =====
# LLM 层
retry.profile=cc
llm.autoContinue.enabled=true
budget.enabled=true
cost.tracking.enabled=true
cost.cachebreak.detect=true
# 工具调度
tools.parallel.metadataDriven=true
tools.maxConcurrency=2
toolsearch.enabled=true
# Bash
bash.snapshot.enabled=true
bash.sessionEnv.enabled=true
bash.autoBackground=false
tools.monitor.enabled=true
# 上下文
microcompact.enabled=true
autocompact.formula=true
compact.restore.enabled=true
toolResults.budget.enabled=true
compact.sessionMemory.enabled=true
toolSummary.enabled=true
# 指令与记忆
instructions.enabled=true
memory.dream.enabled=true
memory.dream.minHours=24
# 多代理与团队
team.enabled=true
agent.coordinatorMode=false
# Hook（仍需会话内批准 cc-hooks.json 快照；超时行为仅 ask|deny）
hooks.enabled=true
hooks.timeoutBehavior=ask
# 持久化
session.transcript.jsonl=true
checkpoint.messageLevel=true
session.cleanupPeriodDays=0
# LSP（依赖 lsp4j + Win7 实机 POC 通过后才置 true；默认保持关闭）
lsp.enabled=false
ide.bridge.enabled=false
# 其他
skills.enabled=true
permissions.managedOnly=false
notify.channel=tray
glob.ccSemantics=true
read.ccSemantics=true
